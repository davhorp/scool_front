<!-- component -->
<!-- This is an example component -->
 <div class="font-sans">
    <div class="relative min-h-screen flex flex-col sm:justify-center items-center bg-gray-100 ">
        <div class="relative sm:max-w-sm w-full">
            <div class="card bg-blue-400 shadow-lg  w-full h-full rounded-3xl absolute  transform -rotate-6"></div>
            <div class="card bg-red-400 shadow-lg  w-full h-full rounded-3xl absolute  transform rotate-6"></div>
            <div class="relative w-full rounded-3xl  px-6 py-4 bg-gray-100 shadow-md">
                <label for="" class="block mt-3 text-sm text-gray-700 text-center font-semibold">
                    Login
                </label>
                <form [formGroup]="miFormulario" (ngSubmit)="login()" method="#" action="#" class="mt-10">            
                    <div>
                        <input formControlName="email" name="email" type="email" placeholder="Correo electronico" class="mt-1 block w-full border-none bg-gray-100 h-11 rounded-xl shadow-lg hover:bg-blue-100 focus:bg-blue-100 focus:ring-0">
                    </div>
                    <div *ngIf="miFormulario.get('email')?.invalid && miFormulario.get('email')?.touched" style="color: red;">
                        El campo e-mail es obligatorio.
                    </div>
                    <div class="mt-7">                
                        <input formControlName="password" name="password"  type="password" placeholder="Contraseña" class="mt-1 block w-full border-none bg-gray-100 h-11 rounded-xl shadow-lg hover:bg-blue-100 focus:bg-blue-100 focus:ring-0">                           
                    </div>
                    <div *ngIf="miFormulario.get('password')?.invalid && miFormulario.get('password')?.touched" style="color: red;">
                        El campo password es obligatorio.
                    </div>
                    <div class="mt-7 flex">
                        <div class="w-full text-center">  
                            <button (click)="forwardForgetPassword()">   
                                <a  class="underline text-sm text-gray-600 hover:text-gray-900">
                                    ¿Olvido su contraseña?
                                </a>
                            </button>                           
                        </div>
                    </div>
                    <div class="mt-7">
                        <button type="submit" class="bg-blue-500 w-full py-3 rounded-xl text-white shadow-xl hover:shadow-inner focus:outline-none transition duration-500 ease-in-out  transform hover:-translate-x hover:scale-105" [disabled]="miFormulario.invalid">
                        <!--<button (click)="login()" class="bg-blue-500 w-full py-3 rounded-xl text-white shadow-xl hover:shadow-inner focus:outline-none transition duration-500 ease-in-out  transform hover:-translate-x hover:scale-105">-->
                            Login
                        </button>
                    </div>
        
                    <div class="image-container"> 
                        <img src="assets/img.png" alt="Logo Colegio Hermanos Grimm" class="responsive-image" />
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
