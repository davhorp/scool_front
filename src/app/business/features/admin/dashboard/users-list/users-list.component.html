<div class="users-container">
  <div class="users-header">
    <h2>Gestión de Usuarios</h2>
    <button class="btn-add" (click)="openAddModal()">+ Nuevo Usuario</button>
  </div>
  @if (isAddModalOpen()) {
  <div class="modal-overlay" (click)="closeAddModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>Registrar Nuevo Usuario</h3>
        <button class="close-x" (click)="closeAddModal()">×</button>
      </div>
      
      <div class="modal-body">
        <div class="form-group">
          <label>Nombre Completo</label>
          <input type="text" 
                 [(ngModel)]="newUser().nombre" 
                 placeholder="Ej. María Jara">
        </div>

        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" 
                 [(ngModel)]="newUser().correo" 
                 placeholder="ejemplo&#64;escuela.com">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Rol en el Sistema</label>
            <select [(ngModel)]="newUser().rol">
              <option value="admin">Administrador</option>
              <option value="docente">Docente</option>
              <option value="alumno">Alumno</option>
              <option value="tutor">Tutor / Padre</option>
            </select>
          </div>

          <div class="form-group">
            <label>Estado Inicial</label>
            <select [(ngModel)]="newUser().estado">
              <option value="activo">Activo</option>
              <option value="inactivo">Inactivo</option>
            </select>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-secondary" (click)="closeAddModal()">Cancelar</button>
        <button class="btn-save" (click)="saveUser()">Guardar Usuario</button>
      </div>
    </div>
  </div>
}
  <div class="filters-bar">
    <div class="search-box">
      <span>🔍</span>
      <input type="text" [(ngModel)]="searchTerm" placeholder="Buscar por nombre o correo...">
    </div>
    
    <select [(ngModel)]="roleFilter" class="role-select">
      <option value="todos">Todos los Roles</option>
      <option value="admin">Administradores</option>
      <option value="docente">Docentes</option>
      <option value="alumno">Alumnos</option>
      <option value="tutor">Tutores</option>
    </select>
  </div>

  <div class="table-responsive">
    <table class="users-table">
      <thead>
        <tr>
          <th>Usuario</th>
          <th>Rol</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (user of filteredUsers(); track user.id) {
          <tr>
            <td>
              <div class="user-cell">
                <div class="user-avatar">{{ user.nombre[0] }}</div>
                <div class="user-data">
                  <span class="u-name">{{ user.nombre }}</span>
                  <span class="u-email" [innerHTML]="user.correo"></span>
                </div>
              </div>
            </td>
            <td>
              <span class="role-badge" [ngClass]="user.rol">{{ user.rol }}</span>
            </td>
            <td>
              <button class="status-indicator" 
                      [class.active]="user.estado === 'activo'"
                      (click)="toggleStatus(user)">
                {{ user.estado }}
              </button>
            </td>
            <td>
              <div class="action-buttons">
                <button class="btn-icon edit" title="Editar">✏️</button>
                <button class="btn-icon delete" (click)="deleteUser(user)" title="Eliminar">🗑️</button>
              </div>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="empty-msg">No se encontraron usuarios con esos filtros.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
