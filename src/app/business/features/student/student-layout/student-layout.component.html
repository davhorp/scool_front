<div class="student-layout" [class.menu-collapsed]="!isMenuOpen()">
  
  <aside class="student-sidebar desktop-only">
    <div class="sidebar-brand">
      <div class="logo-icon">🎓</div>
      @if (isMenuOpen()) {
        <span class="brand-name">EduPortal</span>
      }
    </div>

    <nav class="sidebar-nav">
      @for (item of menuItems; track item.path) {
        <a [routerLink]="item.path" 
           routerLinkActive="active-link" 
           class="nav-item">
          <span class="nav-icon">{{ item.icon }}</span>
          @if (isMenuOpen()) {
            <span class="nav-label">{{ item.label }}</span>
          }
          @if (!isMenuOpen()) {
            <div class="tooltip">{{ item.label }}</div>
          }
        </a>
      }
    </nav>
  </aside>

  <div class="student-main">
    
    <header class="student-navbar desktop-only">
  <div class="nav-left">
    <button class="toggle-btn" (click)="toggleMenu()">
      {{ isMenuOpen() ? '◀' : '☰' }}
    </button>
    <div class="profile-info mobile-only">
    <div class="student-profile-nav">
      <div class="mini-avatar">JP</div>
    </div>
    <div>
      <h2>Hola, {{ nameFullUsr }} 👋</h2>
      <p class="subtitle">3° A Secundaria</p>
      <!--<p>{{ estudiante().grado }}</p>-->
    </div>
  </div>
  </div>

  <div class="nav-right">
    <div class="notifications">
      <span class="bell-icon">🔔</span>
      <span class="badge">1</span>
    </div>
    
    <div class="divider-vertical"></div>
    <button class="btn-logout-header" title="Cerrar Sesión">
      <span>🚪</span> Salir
    </button>
  </div>
</header>

    <main class="student-content">
      <router-outlet></router-outlet>
